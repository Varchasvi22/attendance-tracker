<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        /* Hidden file input for import */
        #importInput { display: none; }
    </style>
</head>
<body class="min-h-screen text-gray-800 p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-8">
        
        <!-- Header & Global Settings -->
        <header class="glass-panel rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center gap-4 relative">
            <div>
                <h1 class="text-3xl font-bold text-indigo-900 tracking-tight">Attendance Tracker</h1>
                <p class="text-gray-500 mt-1">Keep your attendance above the target!</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex gap-2">
                    <button id="importBtn" class="bg-white hover:bg-gray-50 text-indigo-700 border border-indigo-200 font-semibold px-4 py-2.5 rounded-xl shadow-sm transition-all flex items-center gap-2 text-sm" title="Import Data">
                        <i class="fas fa-file-import"></i> <span class="hidden sm:inline">Import</span>
                    </button>
                    <button id="exportBtn" class="bg-white hover:bg-gray-50 text-indigo-700 border border-indigo-200 font-semibold px-4 py-2.5 rounded-xl shadow-sm transition-all flex items-center gap-2 text-sm" title="Export Data">
                        <i class="fas fa-file-export"></i> <span class="hidden sm:inline">Export</span>
                    </button>
                    <input type="file" id="importInput" accept=".json">
                </div>

                <div class="flex items-center gap-3 bg-indigo-50 px-4 py-2.5 rounded-xl border border-indigo-100">
                    <label for="targetInput" class="font-semibold text-indigo-900 whitespace-nowrap text-sm sm:text-base">Target:</label>
                    <div class="relative w-20 sm:w-24">
                        <input type="number" id="targetInput" value="75" min="1" max="100" class="w-full bg-white border border-indigo-200 rounded-lg py-1 pl-3 pr-6 sm:pr-8 text-indigo-900 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm sm:text-base">
                        <span class="absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 text-indigo-500 font-bold text-sm sm:text-base">%</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Analytics Summary Bar -->
        <section id="analyticsContainer" class="glass-panel rounded-2xl p-6 hidden">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><i class="fas fa-chart-line text-indigo-500"></i> Overall Semester Analytics</h2>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <!-- Overall Percentage -->
                <div class="bg-indigo-50 rounded-xl p-4 border border-indigo-100">
                    <div class="text-indigo-600 text-sm font-semibold mb-1">Overall %</div>
                    <div class="text-2xl font-black text-indigo-900" id="overallPercentageText">0%</div>
                </div>
                <!-- Attended / Total -->
                <div class="bg-blue-50 rounded-xl p-4 border border-blue-100">
                    <div class="text-blue-600 text-sm font-semibold mb-1">Classes</div>
                    <div class="text-2xl font-black text-blue-900"><span id="overallAttended">0</span> <span class="text-lg font-bold text-blue-400">/</span> <span id="overallTotal">0</span></div>
                </div>
                <!-- Safe Subjects -->
                <div class="bg-emerald-50 rounded-xl p-4 border border-emerald-100">
                    <div class="text-emerald-600 text-sm font-semibold mb-1">Safe Subjects</div>
                    <div class="text-2xl font-black text-emerald-900" id="safeSubjectsCount">0</div>
                </div>
                <!-- Critical Subjects -->
                <div class="bg-rose-50 rounded-xl p-4 border border-rose-100">
                    <div class="text-rose-600 text-sm font-semibold mb-1">Critical Subjects</div>
                    <div class="text-2xl font-black text-rose-900" id="criticalSubjectsCount">0</div>
                </div>
            </div>

            <!-- Overall Progress Bar -->
            <div>
                <div class="flex justify-between text-xs font-semibold text-gray-500 mb-1 px-1">
                    <span>0%</span>
                    <span>Target: <span id="analyticsTargetMarkerText">75</span>%</span>
                    <span>100%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden relative">
                    <div id="overallProgressBar" class="h-full rounded-full transition-all duration-500 ease-out bg-indigo-500 w-0"></div>
                    <div id="overallTargetMarker" class="absolute top-0 bottom-0 w-0.5 bg-gray-800 z-10 transition-all duration-500" title="Target"></div>
                </div>
            </div>
        </section>

        <!-- Add Subject Section -->
        <section class="glass-panel rounded-2xl p-6">
            <form id="addSubjectForm" class="flex flex-col sm:flex-row gap-4">
                <input type="text" id="subjectNameInput" placeholder="Enter subject name (e.g. Mathematics)" required class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-lg">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-8 py-3 rounded-xl shadow-sm hover:shadow transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-plus"></i> Add Subject
                </button>
            </form>
        </section>

        <!-- Subjects Grid -->
        <section>
            <div id="subjectsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Subject cards will be injected here by JS -->
            </div>
            
            <div id="emptyState" class="hidden text-center py-16 glass-panel rounded-2xl border-dashed border-2 border-gray-300">
                <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-book-open text-3xl text-indigo-300"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-700">No subjects added yet</h3>
                <p class="text-gray-500 mt-2">Add your first subject above to start tracking your attendance.</p>
            </div>
        </section>

    </div>

    <!-- Template for Subject Card -->
    <template id="subjectCardTemplate">
        <div class="subject-card glass-panel rounded-2xl p-6 flex flex-col h-full transition-transform hover:-translate-y-1 duration-300 relative overflow-hidden group">
            
            <button class="delete-btn absolute top-4 right-4 text-gray-400 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100" title="Delete Subject">
                <i class="fas fa-trash"></i>
            </button>

            <h3 class="subject-name text-xl font-bold text-gray-800 mb-1 pr-8 truncate"></h3>
            
            <div class="flex items-center gap-2 mb-4">
                <span class="status-badge px-2.5 py-0.5 rounded-full text-xs font-semibold uppercase tracking-wider"></span>
            </div>

            <div class="flex-1">
                <div class="flex justify-between items-end mb-2">
                    <div class="text-gray-500 text-sm">Attendance</div>
                    <div class="text-2xl font-black percentage-text"></div>
                </div>
                
                <!-- Progress Bar -->
                <div class="w-full bg-gray-100 rounded-full h-3 mb-4 overflow-hidden relative">
                    <div class="progress-bar h-full rounded-full transition-all duration-500 ease-out"></div>
                    <div class="target-marker absolute top-0 bottom-0 w-0.5 bg-gray-800 z-10 transition-all duration-500" title="Target"></div>
                </div>

                <div class="flex justify-between text-sm font-medium text-gray-600 mb-6 bg-gray-50 px-3 py-2 rounded-lg">
                    <span><i class="fas fa-check-circle text-green-500 mr-1"></i> Attended: <span class="attended-count"></span></span>
                    <span><i class="fas fa-list text-blue-500 mr-1"></i> Total: <span class="total-count"></span></span>
                </div>

                <div class="advice-message text-sm rounded-xl p-3 mb-6 font-medium leading-relaxed"></div>
            </div>

            <div class="flex flex-col gap-3 mt-auto">
                <div class="grid grid-cols-2 gap-3">
                    <div class="flex bg-emerald-50 border border-emerald-200 rounded-xl overflow-hidden shadow-sm">
                        <button class="present-btn flex-1 hover:bg-emerald-100 text-emerald-700 font-semibold py-2.5 transition-colors flex justify-center items-center gap-2">
                            <i class="fas fa-check"></i> Present
                        </button>
                        <button class="undo-present-btn hover:bg-emerald-200 text-emerald-600 border-l border-emerald-200 px-3 transition-colors" title="Undo Present (-1)">
                            <i class="fas fa-minus text-xs"></i>
                        </button>
                    </div>
                    <div class="flex bg-rose-50 border border-rose-200 rounded-xl overflow-hidden shadow-sm">
                        <button class="absent-btn flex-1 hover:bg-rose-100 text-rose-700 font-semibold py-2.5 transition-colors flex justify-center items-center gap-2">
                            <i class="fas fa-times"></i> Absent
                        </button>
                        <button class="undo-absent-btn hover:bg-rose-200 text-rose-600 border-l border-rose-200 px-3 transition-colors" title="Undo Absent (-1)">
                            <i class="fas fa-minus text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <button class="reset-btn mt-3 text-sm text-gray-400 hover:text-gray-600 font-medium transition-colors">
                <i class="fas fa-rotate-left mr-1"></i> Reset Subject
            </button>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
